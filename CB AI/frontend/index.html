<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CB AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="demo-host-page">
    <!-- 
      This is the SINGLE DIV CONTAINER representing the College Buddies AI. 
      You can copy and embed this div inside any existing webpage.
    -->
    <div id="cb-ai-widget" class="cb-ai-widget">
        
        <!-- Header -->
        <div class="cb-header">
            <div class="cb-header-left">
                <div class="cb-icon-wrapper">
                    <!-- Clean SVG Placeholder for 🎓 -->
                    <!-- <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="cb-icon">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                        
                    </svg> -->
                    <img src="cb-logo.jpg" alt="college-icon" class="cb-icon-wrapper">
                </div>
                <div class="cb-header-title">
                    <h2>CB AI</h2>
                    <span>Your AI Campus Assistant</span>
                </div>
            </div>
            <div class="cb-header-right">
                <div class="cb-status-indicator"></div>
                <span class="cb-status-text">Connected</span>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="cb-body">
            
            <!-- Hero Screen (Before first message) -->
            <div id="cb-hero-screen" class="cb-hero-screen">
                <div class="cb-hero-content">
                    <h1 class="cb-hero-title">Welcome to College Buddies AI</h1>
                    <p class="cb-hero-subtitle">Ask about notices, events, academics, hostel facilities and more.</p>
                </div>
                
                <div class="cb-quick-actions">
                    <button class="cb-action-card" data-message="Latest Notices">
                        <span class="cb-card-icon">
                            <img src="bell-icon.png" alt="bell-icon" class="cb-card-icon">
                        </span>
                        <span class="cb-card-text">Latest Notices</span>
                    </button>
                    <button class="cb-action-card" data-message="Upcoming Events">
                        <span class="cb-card-icon">
                            <img src="calendar-icon.png" alt="calendar-icon" class="cb-card-icon">
                        </span>
                        <span class="cb-card-text">Upcoming Events</span>
                    </button>
                    <button class="cb-action-card" data-message="Study Help">
                        <span class="cb-card-icon">
                            <img src="book-icon.png" class="cb-card-icon">
                        </span>
                        <span class="cb-card-text">Study Help</span>
                    </button>
                    <button class="cb-action-card" data-message="Hostel Information">
                        <span class="cb-card-icon">
                            <img src="hostel-icon.png" class="cb-card-icon">
                        </span>
                        <span class="cb-card-text">Hostel Information</span>
                    </button>
                </div>
            </div>

            <!-- Chat History (Hidden initially) -->
            <div id="cb-chat-history" class="cb-chat-history">
                <!-- Messages will be injected here -->
            </div>
        </div>

        <!-- Input Area -->
        <div class="cb-footer">
            <div class="cb-input-container">
                <textarea id="cb-chat-input" class="cb-chat-input" placeholder="Type your message here..." rows="1"></textarea>
                <button id="cb-send-button" class="cb-send-button" aria-label="Send message">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>

    </div>

    <script src="chat.js"></script>
</body>
</html>
